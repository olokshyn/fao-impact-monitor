[project]
name = "fao-impact-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleh Lokshyn", email = "olokshyn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "beanie>=2.1.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "scrapling[fetchers]>=0.4.12",
    "wbgapi>=1.0.14",
]

[project.scripts]
fao-impact-monitor = "fao_impact_monitor:main"
check = "fao_impact_monitor.check:main"
install-browsers = "fao_impact_monitor.data_lake.scrapling:ensure_chromium_main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
extend-select = ["I", "ANN"]
ignore = ["ANN401"]  # Allow explicitly chosen Any as an escape hatch

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*.py"]
markers = [
    "integration: tests that call external services",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "wbgapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wbgapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scrapling"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scrapling.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "patchright"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "patchright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true
