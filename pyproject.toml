[project]
name = "fao-impact-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleh Lokshyn", email = "olokshyn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fao-impact-monitor = "fao_impact_monitor:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
extend-select = ["I", "ANN"]
ignore = ["ANN401"]  # Allow explicitly chosen Any as an escape hatch

[tool.mypy]
strict = true
